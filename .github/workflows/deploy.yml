name: Build + Deploy → Cloudflare Pages

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run when the Test workflow succeeded on main (or when manually dispatched)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Reject superseded releases
        run: |
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$CURRENT" || { echo "::error::This release has been superseded by main"; exit 1; }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @nst/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Record local index hash
        id: hash
        run: |
          HASH=$(node -e 'const html = require("node:fs").readFileSync("apps/web/dist/index.html", "utf8"); const match = html.match(/src="\/assets\/(index-[^"/]+\.js)"/); if (!match) process.exit(1); console.log(match[1]);')
          echo "value=$HASH" >> $GITHUB_OUTPUT
          echo "Built index: $HASH"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name nst-control-tower --branch main --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # No-deploy detection: confirm Cloudflare is actually serving the build we
      # just pushed. Without this, a transient CI failure (cached edge, failed
      # upload, wrong project name) silently leaves the live site stale and the
      # next push lands on top of it. The recurrence mode is "I shipped code,
      # the deploy silently didn't run, I'm now debugging the old build" — this
      # step turns that into a loud red ❌ on PR/main instead of a 3-week drift.
      - name: Verify live bundle hash matches local
        run: |
          # Pages' edge takes a few seconds to minutes to serve a new build;
          # a single immediate check false-failed on almost every deploy.
          # Poll for up to 3 minutes before calling the deploy broken.
          WANT="${{ steps.hash.outputs.value }}"
          for HOST in nst-control-tower.pages.dev nst.nonarkara.org; do
            LIVE=""
            for i in $(seq 1 18); do
              LIVE=$(curl --fail --max-time 15 -sSL "https://$HOST/?cb=$RANDOM" -H 'Cache-Control: no-cache' | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1) || LIVE=""
              if [ "$LIVE" = "$WANT" ]; then
                echo "✅ $HOST serves $LIVE — matches local build (check $i)"
                break
              fi
              sleep 10
            done
            if [ "$LIVE" != "$WANT" ]; then
              echo "::error::$HOST serves '$LIVE', expected '$WANT' — deployment is not verified"
              exit 1
            fi
          done

  # The API worker deploys from the same tested commit as the web app, so
  # production can't drift from main (it did on 2026-09-18 when a hand deploy
  # shipped an uncommitted change). Verified by the commit hash /api/health
  # reports back.
  deploy-api:
    name: Deploy API worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run checks out the default branch head; pin to the tested commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Reject superseded releases
        run: |
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD)" = "$CURRENT" || { echo "::error::This release has been superseded by main"; exit 1; }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy worker
        working-directory: apps/api
        run: npx wrangler deploy --var GIT_SHA:${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live API is this commit
        run: |
          WANT="${{ github.event.workflow_run.head_sha || github.sha }}"
          for i in $(seq 1 12); do
            GOT=$(curl -s "https://nst-control-tower-api.drnon.workers.dev/api/health?cb=$RANDOM" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$GOT" = "$WANT" ]; then echo "✅ API is serving $GOT"; exit 0; fi
            sleep 10
          done
          echo "::error::API reports version '$GOT', expected $WANT — worker deploy did not take"
          exit 1
