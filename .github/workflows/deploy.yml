name: Build + Deploy → Cloudflare Pages

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Only run when the Test workflow succeeded on main (or when manually dispatched)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @nst/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Record local index hash
        id: hash
        run: |
          HASH=$(ls apps/web/dist/assets/index-*.js | head -1 | sed 's/.*\///')
          echo "value=$HASH" >> $GITHUB_OUTPUT
          echo "Built index: $HASH"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name nst-control-tower --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # No-deploy detection: confirm Cloudflare is actually serving the build we
      # just pushed. Without this, a transient CI failure (cached edge, failed
      # upload, wrong project name) silently leaves the live site stale and the
      # next push lands on top of it. The recurrence mode is "I shipped code,
      # the deploy silently didn't run, I'm now debugging the old build" — this
      # step turns that into a loud red ❌ on PR/main instead of a 3-week drift.
      - name: Verify live bundle hash matches local
        run: |
          # Pages' edge takes a few seconds to minutes to serve a new build;
          # a single immediate check false-failed on almost every deploy.
          # Poll for up to 3 minutes before calling the deploy broken.
          WANT="${{ steps.hash.outputs.value }}"
          LIVE=""
          for i in $(seq 1 18); do
            LIVE=$(curl -sSL "https://nst-control-tower.pages.dev/?cb=$RANDOM" -H 'Cache-Control: no-cache' | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$LIVE" = "$WANT" ]; then
              echo "✅ Live site is serving $LIVE — matches local build (check $i)"
              exit 0
            fi
            sleep 10
          done
          if [ -z "$LIVE" ]; then
            echo "::error::Live site returned no index-*.js hash — site is broken or unreachable"
          else
            echo "::error::After 3 min the live site still serves $LIVE, not $WANT"
            echo "::error::Deploy did NOT take. Investigate before pushing the next commit."
          fi
          exit 1
