name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck (shared)
        run: pnpm --filter @nst/shared typecheck

      - name: Typecheck (web)
        run: pnpm --filter @nst/web typecheck

      - name: Typecheck (api)
        run: pnpm --filter @nst/api typecheck

      - name: Unit tests (shared)
        run: pnpm --filter @nst/shared test

      - name: Unit tests (web)
        run: pnpm --filter @nst/web test

      - name: Unit tests (api)
        run: pnpm --filter @nst/api test

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @nst/web exec playwright install --with-deps chromium

      - name: Build production web app
        run: pnpm --filter @nst/web build
        env:
          VITE_E2E: "1"

      - name: Run E2E smoke tests
        run: pnpm --filter @nst/web test:e2e
        env:
          CI: "1"
          PLAYWRIGHT_PREVIEW: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
