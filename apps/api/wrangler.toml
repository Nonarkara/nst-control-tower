name = "nst-control-tower-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
# Do not commit a Cloudflare account id. `wrangler deploy` reads
# CLOUDFLARE_ACCOUNT_ID from the environment. The deploy workflow passes the
# GitHub Actions variable of the same name.
workers_dev = true

[observability]
enabled = true

# Bindings (KV cache for adapter responses, persists across requests)
# Create with: wrangler kv namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<fill-after-create>"

[vars]
ENVIRONMENT = "production"

# Cloudflare's own translation model. The desk's headlines are translated by
# it when the public translate endpoint cannot be reached from the Worker's
# egress — measured on 2026-10-26: it could not, and the desk served a page
# of English with no explanation.
[ai]
binding = "AI"
